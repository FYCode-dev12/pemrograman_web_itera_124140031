<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini POS - Kasir & Keranjang Belanja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Aplikasi Kasir & Keranjang Belanja (Mini POS)</h1>

        <div class="form-section">
            <h2>Tambah Barang</h2>
            <form id="add-item-form">
                <div class="form-group">
                    <label for="namaBarang">Nama Barang</label>
                    <input type="text" id="namaBarang" placeholder="Contoh: Buku Tulis">
                    <div id="error-nama" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="hargaSatuan">Harga Satuan (Rp)</label>
                    <input type="number" id="hargaSatuan" placeholder="Min. 500">
                    <div id="error-harga" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="qty">Jumlah / Qty</label>
                    <input type="number" id="qty" placeholder="Min. 1">
                    <div id="error-qty" class="error-message"></div>
                </div>

                <button type="submit" id="btn-tambah">Tambah ke Keranjang</button>
            </form>
        </div>

        <div class="cart-section">
            <h2>Keranjang Belanja</h2>
            <table id="cart-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Barang</th>
                        <th>Harga Satuan</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="cart-body">
                    <!-- Data will be populated here -->
                </tbody>
            </table>

            <div class="summary-section">
                <p>Total Belanja: <span id="total-belanja">Rp 0</span></p>
                <p>Diskon (10% untuk transaksi >= Rp 50.000): <span id="diskon">Rp 0</span></p>
                <h3>Total Akhir: <span id="total-akhir">Rp 0</span></h3>
            </div>

            <div class="payment-section">
                <div class="form-group">
                    <label for="uangBayar">Uang Bayar (Rp)</label>
                    <input type="number" id="uangBayar" placeholder="Masukkan nominal uang">
                    <button type="button" id="btn-bayar">Bayar</button>
                    <div id="payment-feedback"></div>
                </div>
                <h3>Kembalian: <span id="kembalian">Rp 0</span></h3>
            </div>

            <button type="button" id="btn-reset" class="btn-danger">Transaksi Baru / Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
